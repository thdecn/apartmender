<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apartmender" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#14120f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Apartmender Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="rotate-hint" class="rotate-hint" hidden>
      <p>Rotate your phone to landscape</p>
    </div>

    <main id="home" class="screen home">
      <p class="brand">Apartmender</p>
      <h1>Practice</h1>
      <div id="piece-list" class="piece-list"></div>
      <fieldset class="practice-mode-picker">
        <legend>Practice mode</legend>
        <div class="practice-mode-options">
          <input
            type="radio"
            id="practice-mode-normal"
            name="practice-mode"
            value="normal"
            checked
          />
          <label for="practice-mode-normal">Normal</label>
          <input
            type="radio"
            id="practice-mode-hard"
            name="practice-mode"
            value="hard"
          />
          <label for="practice-mode-hard">Hard</label>
        </div>
      </fieldset>
    </main>

    <main id="practice" class="screen practice" hidden></main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
