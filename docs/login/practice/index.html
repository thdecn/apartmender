<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14120f" />
    <title>Student Home · Apartmender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body>
    <div id="rotate-hint" class="rotate-hint" hidden>
      <p>Rotate your phone to landscape</p>
    </div>

    <main id="home" class="screen home student-home">
      <p class="brand">Apartmender</p>
      <h1>Student Home</h1>
      <p id="name-display" class="username-display" aria-live="polite">Loading account…</p>

      <section id="comments-section" class="student-comments" aria-label="General comments" hidden>
        <h2>Comments</h2>
        <div id="comments-list" class="comments-list"></div>
      </section>

      <section id="pieces-section" class="student-pieces" aria-label="Assigned Pieces" hidden>
        <h2>Pieces</h2>
        <div id="piece-list" class="piece-list"></div>
        <p id="piece-status" class="piece-status" aria-live="polite"></p>
      </section>

      <fieldset id="student-practice-mode" class="practice-mode-picker" hidden>
        <legend>Practice mode</legend>
        <div class="practice-mode-options">
          <input
            type="radio"
            id="practice-mode-normal"
            name="practice-mode"
            value="normal"
            checked
          />
          <label for="practice-mode-normal">Normal</label>
          <input
            type="radio"
            id="practice-mode-hard"
            name="practice-mode"
            value="hard"
          />
          <label for="practice-mode-hard">Hard</label>
        </div>
      </fieldset>
      <a class="text-btn login-back" id="logout" href="../">Logout</a>
    </main>

    <main id="practice" class="screen practice" hidden>
      <header class="practice-top">
        <button type="button" id="home-btn" class="text-btn" aria-label="Back home">
          Home
        </button>
        <p id="piece-title" class="piece-title"></p>
        <div class="practice-meta">
          <p id="practice-timer" class="practice-timer" aria-label="Practice time">
            <span class="practice-timer-icon" aria-hidden="true">◷</span>
            <span id="practice-timer-value">0:00</span>
          </p>
          <div class="card-nav" aria-label="Practice measures">
            <button
              type="button"
              id="next-card-btn"
              class="card-nav-btn"
              aria-label="Next playable measure"
              disabled
            >
              ‹
            </button>
            <p id="card-meta" class="card-meta" aria-live="polite"></p>
            <button
              type="button"
              id="previous-card-btn"
              class="card-nav-btn"
              aria-label="Previous playable measure"
              disabled
            >
              ›
            </button>
          </div>
        </div>
      </header>

      <section class="stage">
        <div id="counter" class="counter" aria-live="polite">0</div>
        <figure class="card-frame">
          <img id="card-image" alt="Practice card" draggable="false" />
        </figure>
      </section>

      <nav class="controls">
        <button type="button" id="mistake-btn" class="btn btn-mistake">Mistake</button>
        <button type="button" id="good-btn" class="btn btn-good">Good</button>
        <button type="button" id="advance-btn" class="btn btn-advance" disabled>
          Advance
        </button>
      </nav>
    </main>

    <script type="module" src="./practice.js"></script>
  </body>
</html>
