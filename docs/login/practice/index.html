<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14120f" />
    <title>Hello · Apartmender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body>
    <main class="screen home login">
      <p class="brand">Apartmender</p>
      <h1>Hello</h1>
      <p id="name-display" class="username-display" aria-live="polite"></p>
      <form id="password-form" class="login-form" hidden>
        <label for="new-password">New password</label>
        <input
          id="new-password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />
        <button type="submit" class="btn btn-continue">Save password</button>
        <p id="password-error" class="login-error" aria-live="polite"></p>
      </form>
      <dl id="student-record" class="student-record" hidden>
        <div>
          <dt>Piece</dt>
          <dd id="piece"></dd>
        </div>
        <div>
          <dt>Teacher note</dt>
          <dd id="teacher-note"></dd>
        </div>
      </dl>
      <a class="text-btn login-back" id="logout" href="../">Logout</a>
    </main>
    <script type="module" src="./practice.js"></script>
  </body>
</html>
