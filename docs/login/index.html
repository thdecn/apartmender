<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14120f" />
    <title>Login · Apartmender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="screen home login">
      <p class="brand">Apartmender</p>
      <h1>Login</h1>
      <form id="login-form" class="login-form">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
          autofocus
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <button type="submit" class="btn btn-continue">Continue</button>
        <p id="login-error" class="login-error" aria-live="polite"></p>
      </form>
      <p id="invite-account" class="invite-account" hidden></p>
      <form id="invite-form" class="login-form" hidden>
        <label for="invite-password">New password</label>
        <input
          id="invite-password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />
        <button type="submit" class="btn btn-continue">Save password</button>
        <p id="invite-error" class="login-error" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="./login.js"></script>
  </body>
</html>
